[workspace]
resolver = "3"
members = ["crates/spellcode-term", "crates/spellcode-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
gpui = "0.2.2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "1.1"

[profile.dev]
opt-level = 1
incremental = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
